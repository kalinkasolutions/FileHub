<div class="brand">
  <img src="file-hub.svg" alt="FileHub" />
</div>

<h1>Reset password</h1>

@if (hasValidLink()) {
  <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
    <div class="form-control">
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="••••••••"
        autocomplete="new-password"
        minlength="4"
        required
      />
    </div>

    <div class="form-control">
      <label for="confirmPassword">Repeat password</label>
      <input
        id="confirmPassword"
        type="password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        placeholder="••••••••"
        autocomplete="new-password"
        required
      />
      @if (mismatch()) {
        <span class="error">The passwords don't match.</span>
      }
    </div>

    <button type="submit" [disabled]="resetForm.invalid || mismatch() || isLoading()">
      {{ isLoading() ? 'Resetting...' : 'Reset password' }}
    </button>
  </form>
} @else {
  <div class="message">
    <p class="notice">
      This password reset link is invalid or incomplete. Please request a new one.
    </p>
    <div class="nav-link">
      <a routerLink="/forgot-password">Request a new link</a>
    </div>
  </div>
}

<div class="nav-link">
  <a routerLink="/login">Back to sign in</a>
</div>
