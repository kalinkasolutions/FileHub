@if (signedIn()) {
  <a class="brand" routerLink="/" title="FileHub">
    <img src="file-hub.svg" alt="FileHub" />
  </a>
  <!-- Where you are, spelled out as a path rather than left to a highlighted icon. -->
  <span class="section">{{ section() }}</span>

  <!-- Navigation is links, not buttons: they go somewhere, and the one you are on is underlined
       in the accent. Only signing out — which acts on the session — is a control. -->
  <nav>
    <a class="nav" routerLink="/" [class.active]="section() === 'Files'">directories</a>

    <a class="nav" routerLink="/account" [class.active]="section() === 'Account'">account</a>

    <!-- Last, and so nearest the sign-out control: the one link most of the accounts on an
         installation never see, and the one that leaves the ordinary run of the app. -->
    @if (isAdmin()) {
      <a class="nav" routerLink="/admin" [class.active]="section() === 'Admin'">admin</a>
    }

    <!-- Not a word in the row of destinations: what release this is, and who the logo belongs to,
         is asked once and then never again. It sits with the sign-out control because both act on
         the app itself rather than on what you are looking at. -->
    <a
      class="icon-btn quiet"
      routerLink="/about"
      [class.active]="section() === 'About'"
      title="About FileHub"
      aria-label="About FileHub"
    >
      <mat-icon>help</mat-icon>
    </a>

    <button
      class="icon-btn quiet"
      type="button"
      (click)="signOut()"
      title="Sign out"
      aria-label="Sign out"
    >
      <mat-icon>logout</mat-icon>
    </button>
  </nav>
} @else {
  <!-- No session: the mark, and nothing that would need one. -->
  <span class="brand">
    <img src="file-hub.svg" alt="FileHub" />
  </span>
}
