<div class="brand">
  <img src="file-hub.svg" alt="FileHub" />
</div>

<h1>Forgot password</h1>

<form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
  <p class="notice">Enter your email and we'll send you a link to reset your password.</p>

  <div class="form-control">
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="you@example.com"
      autocomplete="email"
      required
      email
    />
  </div>

  <button type="submit" [disabled]="forgotForm.invalid || isLoading()">
    {{ isLoading() ? 'Sending...' : 'Send reset link' }}
  </button>
</form>

<div class="nav-link">
  <a routerLink="/login">Back to sign in</a>
</div>
