@if (share(); as share) {
  <section class="panel">
    <span class="glyph">
      <mat-icon>{{ share.isDir ? 'folder' : 'draft' }}</mat-icon>
    </span>

    <h1>You've been sent a {{ share.isDir ? 'folder' : 'file' }}</h1>

    <div class="details">
      <span class="name" [title]="share.name">{{ share.name }}</span>
      <span class="size">{{ formatSize(share.size) }}</span>
    </div>

    <a class="download" [href]="downloadUrl()">
      <mat-icon>download</mat-icon>
      Download
    </a>

    @if (share.isDir) {
      <p class="hint">The folder arrives as a zip.</p>
    }

    <button class="link" type="button" (click)="copyLink()">Copy this link</button>
  </section>
} @else if (loading()) {
  <p class="hint">Opening the link…</p>
}
