<section class="panel">
  <h1>404 NOT FOUND :/</h1>

  <!-- The beaver is the original screen's, and the joke only works if it carries its own caption. -->
  <img class="beaver" src="thebeaver.png" [title]="theBeaverText" [alt]="theBeaverText" />

  <p class="hint">
    This page doesn't exist — or it was a share link that has expired, been used up, or been taken
    down. Ask whoever sent it for a new one.
  </p>

  <a class="exit" [routerLink]="exit()">{{ exitLabel() }}</a>
</section>
