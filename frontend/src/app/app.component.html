@if (isLoading | async) {
  <div class="loading-overlay">
    <div class="spinner"></div>
  </div>
}

<!-- One outlet, always: toggling between two would tear the routed component down and build it
     again on every navigation that changed the chrome. -->
<div class="shell" [class.chromed]="showHeader()">
  @if (showHeader()) {
    <app-header [anonymous]="anonymous()" />
  }
  <router-outlet></router-outlet>
</div>
