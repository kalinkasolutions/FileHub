<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The maskable app icon: the same F, full-bleed, with the whole glyph inside the 80% safe
     circle so no launcher mask can clip a corner of it.

     This SVG is the source; the PNGs beside it are rasterised from it, because Chrome will not
     treat an SVG-only manifest as installable. Regenerate them with any rasteriser at the sizes
     the manifest lists — e.g. `rsvg-convert -w 512 -h 512 icon-maskable.svg -o icon-maskable-512.png`. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 130 130">
  <rect width="130" height="130" fill="#333333" />
  <path fill="#006be0" stroke="#006be0" stroke-width="3.782" stroke-linejoin="bevel" d="M32.065 32.529 L32.065 97.471 L52.476 97.471 L52.476 72.886 L91.441 72.886 L91.441 57.114 L52.476 57.114 L52.476 48.301 L97.935 48.301 L97.935 32.529Z" />
</svg>
