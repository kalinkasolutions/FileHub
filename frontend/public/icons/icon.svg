<!-- The app icon, and the source the PNGs and favicon.ico are rasterised from.

     The F of the File-Hub wordmark (frontend/public/file-hub.svg), its outline copied unaltered,
     on the app's own page colour.

     This SVG is the source; the PNGs beside it are rasterised from it, because Chrome will not
     treat an SVG-only manifest as installable. Regenerate them with any rasteriser at the sizes
     the manifest lists — e.g. `rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png`. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 90 90">
  <rect width="90" height="90" rx="16" fill="#333333" />
  <path fill="#006be0" stroke="#006be0" stroke-width="3.782" stroke-linejoin="bevel" d="M12.065 12.529 L12.065 77.471 L32.476 77.471 L32.476 52.886 L71.441 52.886 L71.441 37.114 L32.476 37.114 L32.476 28.301 L77.935 28.301 L77.935 12.529Z" />
</svg>
