# Reference reverse-proxy config for FileHub.
#
# This file used to BE the access-control system: it split the routes into a LAN-only half and a
# public half, and the ordering of the location blocks was load-bearing. That is gone. The
# application authenticates now — sign-in and roles are the gate, and the browsing UI is meant to
# be reachable from the internet. So there is one location, and nginx's only jobs are TLS
# termination and getting the request through untouched.
#
# Reachable without a session: /public-api/ and /og/share/ (the share-link routes and their
# Open Graph previews). Everything else requires a signed-in user and answers 401 — the app
# returns a status code rather than a 302 to a login page, because the SPA calls it with fetch
# and needs something it can act on.

server {
    listen 80;
    listen [::]:80;
    server_name file-hub.kalinka.ch;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 http2 ssl;
    server_name file-hub.kalinka.ch;

    include "sites-enabled/shared/proxy";
    include "sites-enabled/shared/ssl_kalinka";

    # FileHub streams downloads and generated zips, so uploads to it are small but responses are
    # not. Raise the request body limit only if you ever add an upload route; 0 disables the check.
    client_max_body_size 100m;

    location / {
        # The container's published port; must match the host side of the compose port mapping.
        proxy_pass http://10.0.10.30:4122;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts X-Forwarded-* (UseForwardedHeaders). Without X-Forwarded-Proto it sees
        # every request as plain http and issues auth cookies without the Secure flag; without
        # X-Forwarded-For every log line and lockout counter shows the proxy's own address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Stream the response straight through. With buffering on, nginx spools the whole body to
        # disk before sending a byte — for a multi-gigabyte download or a zip generated on the fly
        # that fills the proxy's disk and stalls the client until the file is fully copied.
        proxy_buffering off;
        proxy_request_buffering off;

        # A zip of a large directory can take minutes to generate and stream, and produces no
        # output at all while it is being built. The default 60s read timeout kills exactly that.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Byte-range requests are what makes video seeking work; do not let nginx rewrite them.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
