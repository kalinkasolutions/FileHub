# Reference reverse-proxy config for FileHub.
#
# This file used to BE the access-control system: it split the routes into a LAN-only half and a
# public half, and the ordering of the location blocks was load-bearing. That is gone. The
# application authenticates now — sign-in and roles are the gate, and the browsing UI is meant to
# be reachable from the internet. So there is one location, and nginx's only jobs are TLS
# termination and getting the request through untouched.
#
# Reachable without a session: /public-api/ and /og/share/ (the share-link routes and their
# Open Graph previews). Everything else requires a signed-in user and answers 401 — the app
# returns a status code rather than a 302 to a login page, because the SPA calls it with fetch
# and needs something it can act on.
#
# Two zones this file uses have to be declared in the http { } block of nginx.conf, because
# limit_req_zone and limit_conn_zone are only valid there:
#
#     limit_req_zone  $binary_remote_addr zone=filehub_req:10m rate=20r/s;
#     limit_conn_zone $binary_remote_addr zone=filehub_conn:10m;
#
# They bound what one address can ask of the app *before* a request costs Kestrel a thread: the
# in-app limiter only covers the share links, and a slow reader on a streaming download holds a
# connection for as long as it likes (proxy_read_timeout below is an hour, on purpose).

server {
    listen 80;
    listen [::]:80;
    server_name file-hub.kalinka.ch;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 http2 ssl;
    server_name file-hub.kalinka.ch;

    include "sites-enabled/shared/proxy";
    include "sites-enabled/shared/ssl_kalinka";

    # FileHub streams downloads and generated zips, so uploads to it are small but responses are
    # not. Raise the request body limit only if you ever add an upload route; 0 disables the check.
    client_max_body_size 100m;

    # --- response headers ---
    # "always" so they are sent on error responses too — a 401 or a 404 page is still a page an
    # attacker can frame or a browser can sniff. These are set on the server, not in the location,
    # because an add_header anywhere inside a location replaces the whole inherited set.

    # Without this the 301 above is the only thing keeping a session off plain http, and it is one
    # request too late: the browser has already sent the cookie. Two years, subdomains included —
    # both are commitments, so only turn on includeSubDomains once every subdomain is on TLS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # FileHub serves files somebody else put on a disk. Content-Type comes from the extension, so
    # without nosniff a browser is free to decide an uploaded .txt is really HTML and run it.
    add_header X-Content-Type-Options "nosniff" always;

    # The admin UI deletes base paths, revokes links and removes accounts on a click. Framed, those
    # clicks can be someone else's. X-Frame-Options for old browsers, frame-ancestors below for the
    # rest; there is nothing in FileHub that is meant to be embedded.
    add_header X-Frame-Options "DENY" always;

    # A share link is pasted into chats and mail. Do not let the full URL — which *is* the
    # credential for that share — leak in the Referer of anything it links to.
    add_header Referrer-Policy "no-referrer" always;

    # 'unsafe-inline' for scripts is not slack: og/share/{id} redirects with an inline <script>,
    # and its one interpolated value is JavaScript-encoded in OpenGraphPage. Angular and Material
    # inject component styles as <style> elements, hence the same for styles. The fonts are the
    # only third-party origins the SPA loads. If the og page ever gets a nonce, drop the script one.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; form-action 'self'" always;

    location / {
        # Rate and connection ceilings per client address; see the zone declarations at the top.
        # burst=40 nodelay lets a page load fire its whole set of asset requests at once and only
        # bites on a sustained stream. The connection limit is what bounds a slow-reader sink:
        # a browser opens ~6 per host, so 20 leaves room for parallel downloads and no more.
        limit_req  zone=filehub_req burst=40 nodelay;
        limit_conn filehub_conn 20;

        # The container's published port. docker-compose.yml publishes it on 127.0.0.1 and on the
        # same number, so the two cannot drift — if nginx runs on another host, change the compose
        # bind address to match and put this proxy's address in TRUSTED_PROXIES.
        proxy_pass http://127.0.0.1:4122;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts X-Forwarded-* from an address in TRUSTED_PROXIES, and only from there.
        # This proxy has to be on that list or the headers below are dropped: it then sees every
        # request as plain http and issues auth cookies without the Secure flag, and every log
        # line, lockout counter and rate-limit bucket collapses onto the proxy's own address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Stream the response straight through. With buffering on, nginx spools the whole body to
        # disk before sending a byte — for a multi-gigabyte download or a zip generated on the fly
        # that fills the proxy's disk and stalls the client until the file is fully copied.
        proxy_buffering off;
        proxy_request_buffering off;

        # A zip of a large directory can take minutes to generate and stream, and produces no
        # output at all while it is being built. The default 60s read timeout kills exactly that.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Byte-range requests are what makes video seeking work; do not let nginx rewrite them.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
