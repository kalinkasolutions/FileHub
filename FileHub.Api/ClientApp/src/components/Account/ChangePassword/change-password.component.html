<h2>Password</h2>

<form (ngSubmit)="submit()">
  <input
    id="accountCurrentPassword"
    type="password"
    name="accountCurrentPassword"
    autocomplete="current-password"
    placeholder="Current password"
    aria-label="Current password"
    [ngModel]="currentPassword()"
    (ngModelChange)="currentPassword.set($event)"
  />

  <input
    id="accountNewPassword"
    type="password"
    name="accountNewPassword"
    autocomplete="new-password"
    placeholder="New password"
    aria-label="New password"
    [ngModel]="newPassword()"
    (ngModelChange)="newPassword.set($event)"
  />
  @if (tooShort()) {
    <span class="error">Use at least 8 characters.</span>
  }

  <input
    id="accountConfirmPassword"
    type="password"
    name="accountConfirmPassword"
    autocomplete="new-password"
    placeholder="Repeat new password"
    aria-label="Repeat new password"
    [ngModel]="confirmPassword()"
    (ngModelChange)="confirmPassword.set($event)"
  />
  @if (mismatch()) {
    <span class="error">The new passwords don't match.</span>
  }

  <button class="secondary" type="submit" [disabled]="!canSubmit()">
    {{ busy() ? 'Changing…' : 'Update password' }}
  </button>
</form>

<p class="hint">
  Changing your password signs you out everywhere else. You stay signed in on this device.
</p>
