<div class="head">
  <h3>{{ heading() }}</h3>
  <span class="count">{{ count() }}</span>
</div>

@if (options().length === 0) {
  <p class="empty">{{ emptyText() }}</p>
} @else {
  <ul class="options">
    @for (option of options(); track option.id) {
      <li>
        <label>
          <input
            type="checkbox"
            [checked]="isChecked(option.id)"
            (change)="toggle(option.id, $any($event.target).checked)"
          />
          <span class="text">
            <span class="label">{{ option.label }}</span>
            <span class="hint">{{ option.hint }}</span>
          </span>
        </label>
      </li>
    }
  </ul>
}

<div class="buttons">
  <button class="secondary" type="button" (click)="cancel.emit()">Cancel</button>
  <button type="button" [disabled]="busy()" (click)="onSave()">Save access</button>
</div>
