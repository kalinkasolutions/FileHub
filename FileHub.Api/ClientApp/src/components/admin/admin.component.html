<header class="screen-header">
  <span class="title">Administration</span>
  <a routerLink="/">Back</a>
</header>

<main class="content">
  @switch (section()) {
    @case ('users') {
      @defer {
        <admin-users (showEmail)="show('email')" />
      } @placeholder {
        <p class="loading">Loading...</p>
      }
    }
    @case ('basePaths') {
      @defer {
        <admin-base-paths />
      } @placeholder {
        <p class="loading">Loading...</p>
      }
    }
    @case ('shares') {
      @defer {
        <admin-shares />
      } @placeholder {
        <p class="loading">Loading...</p>
      }
    }
    @case ('email') {
      @defer {
        <admin-email-settings />
      } @placeholder {
        <p class="loading">Loading...</p>
      }
    }
  }
</main>

<nav class="tabs">
  <button
    class="tab"
    type="button"
    [class.active]="section() === 'users'"
    (click)="show('users')"
    aria-label="Users"
  >
    <mat-icon>group</mat-icon>
    <span class="label">Users</span>
  </button>
  <button
    class="tab"
    type="button"
    [class.active]="section() === 'basePaths'"
    (click)="show('basePaths')"
    aria-label="Base paths"
  >
    <mat-icon>folder_open</mat-icon>
    <span class="label">Paths</span>
  </button>
  <button
    class="tab"
    type="button"
    [class.active]="section() === 'shares'"
    (click)="show('shares')"
    aria-label="Share links"
  >
    <mat-icon>link</mat-icon>
    <span class="label">Links</span>
  </button>
  <button
    class="tab"
    type="button"
    [class.active]="section() === 'email'"
    (click)="show('email')"
    aria-label="Email settings"
  >
    <mat-icon>mail</mat-icon>
    <span class="label">Email</span>
  </button>
</nav>
