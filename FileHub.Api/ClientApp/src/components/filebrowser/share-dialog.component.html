<h2 mat-dialog-title>Share this</h2>

<mat-dialog-content>
  <p class="target">{{ data.name }}</p>

  @if (link()) {
    <div class="form-control">
      <label for="share-link">Public link</label>
      <div class="link-row">
        <input id="share-link" type="text" readonly [value]="link()" />
        <button class="icon-btn" type="button" aria-label="Copy the link" (click)="copy()">
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
    </div>
  } @else {
    <div class="form-control">
      <label for="share-limit">Download limit</label>
      <input
        id="share-limit"
        type="number"
        name="limit"
        min="0"
        step="1"
        [ngModel]="limit()"
        (ngModelChange)="setLimit($event)"
      />
      <span class="hint">0 lets the link be used as often as anyone likes.</span>
    </div>
  }

  <!-- Shown in both states and not only next to the finished URL: who can open a link is the one
       thing the URL itself never shows. -->
  <p class="audience-note">
    <mat-icon>public</mat-icon>
    <span>Anyone with this link can download it — no sign-in needed.</span>
  </p>
</mat-dialog-content>

<mat-dialog-actions>
  @if (link()) {
    <button type="button" mat-dialog-close>Done</button>
  } @else {
    <button class="secondary" type="button" mat-dialog-close>Cancel</button>
    <button type="button" [disabled]="isSaving()" (click)="create()">
      {{ isSaving() ? 'Creating…' : 'Create link' }}
    </button>
  }
</mat-dialog-actions>
