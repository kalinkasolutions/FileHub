<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@Title</title>
</head>
<body style="margin:0; padding:24px; background:#141415; color:#f2f1f0; font-family:Consolas,'Lucida Console',Menlo,monospace;">
<div style="max-width:480px; margin:0 auto; padding:28px; background:#2b2828; border-top:4px solid #2fc812; border-radius:8px;">
    <img src="@LogoUrl" alt="FileHub" width="64" height="53" style="display:block; width:64px; height:53px; margin:0 0 20px; border:0;">
    <h1 style="margin:0 0 16px; font-size:20px; font-weight:bold; color:#f2f1f0;">@Title</h1>
    <p style="margin:0 0 16px; font-size:14px; line-height:1.6; color:#c9c6c2;">
        This is a test message from FileHub. It arrived, so the SMTP settings you saved can send
        invitations, password resets and email-change confirmations.
    </p>
    <a href="@AppUrl" style="display:inline-block; margin:4px 0 20px; padding:12px 20px; background:#2fc812; color:#141415; font-size:14px; font-weight:bold; text-decoration:none; border-radius:6px;">Open FileHub</a>
    <p style="margin:24px 0 0; font-size:12px; line-height:1.6; color:#6f6f6f;">
        If you didn't ask for a test email, an administrator of this FileHub install did — nothing
        about your account has changed.
    </p>
</div>
</body>
</html>
