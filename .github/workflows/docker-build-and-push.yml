name: Build and Push Multi-Platform Docker Image

on:
    release:
        types: [published]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_API_TOKEN }}

            - name: Build and push multi-platform Docker image
              # Everything caller-controlled comes in through the environment. A ${{ }} expression is
              # substituted into the script *before* bash parses it, so a release tag containing shell
              # metacharacters would run as a command — in the one step that holds the registry token.
              # Anyone able to publish a release could push whatever image they liked, or read the token.
              env:
                  VERSION: ${{ github.ref_name }}
                  COMMIT_SHA: ${{ github.sha }}
                  IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/filehub
              run: |
                  set -euo pipefail
                  BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  docker buildx create --use
                  docker buildx build \
                    --platform linux/amd64 \
                    --build-arg "VERSION=$VERSION" \
                    --build-arg "COMMIT_SHA=$COMMIT_SHA" \
                    --build-arg "BUILD_DATE=$BUILD_DATE" \
                    -t "$IMAGE:$VERSION" \
                    -t "$IMAGE:latest" \
                    --push .
